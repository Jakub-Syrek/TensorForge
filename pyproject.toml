[project]
name = "tensorforge"
version = "0.2.0"
description = "Local creative ML image workstation — FLUX, ControlNet, IP-Adapter, PuLID, Real-ESRGAN — RTX 5080 optimized."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["models", "outputs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",  # line length handled by formatter; long URLs in comments are fine
  "B008",  # FastAPI requires File(...)/Form(...) as default values — canonical idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"backend/server.py" = ["E402"]  # sys.path tweak before backend.* imports for `python backend/server.py`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
