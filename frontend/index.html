<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiPictureModifier · FLUX edit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>AiPictureModifier</h1>
    <div class="header-info">
      <div id="profile" class="muted small"></div>
      <div id="health" class="muted">checking GPU…</div>
    </div>
  </header>

  <main>
    <section class="panel left">
      <div class="row">
        <label class="dropzone" id="dropzone">
          <input type="file" id="file" accept="image/*" hidden />
          <span id="dropHint">drop image · or click to choose</span>
        </label>
      </div>

      <div class="row analyze-row hidden" id="analyzeRow">
        <button type="button" id="analyzeFastBtn" title="BLIP-large caption (single sentence) + DETR object chips. ~0.9 GB VRAM, fast. Click a chip to insert its label into the prompt.">fast analyze</button>
        <button type="button" id="analyzeDeepBtn" title="BLIP-2 OPT-2.7B caption (multi-sentence, richer detail with spatial relations) + DETR object chips. ~5.4 GB VRAM, slower first-load. Use when the fast caption isn't enough.">deep analyze</button>
        <button type="button" id="bgRemoveBtn" title="Isolate the subject from the background using BiRefNet. Result loads as the new input image with a transparent background — feed it to FLUX Fill for a fresh backdrop.">remove bg</button>
        <span id="analyzeStatus" class="muted small"></span>
        <div class="analyze-caption muted small" id="analyzeCaption"></div>
        <div class="analyze-chips" id="analyzeChips"></div>
      </div>

      <div class="row mode-row">
        <div class="seg">
          <button type="button" data-mode="auto" class="seg-btn active" title="Auto: routes to Kontext (edit) or Schnell (generate) based on the first word of the prompt and whether an image is uploaded">auto</button>
          <button type="button" data-mode="kontext" class="seg-btn" title="FLUX.1 Kontext-dev — instruction edit, preserves composition">Kontext</button>
          <button type="button" data-mode="inpaint" class="seg-btn" title="FLUX.1 Fill-dev — regenerates the masked region only">inpaint</button>
          <button type="button" data-mode="qwen" class="seg-btn" title="Qwen-Image-Edit — alternative instruction edit (Qwen2-VL text encoder, ~50 steps default)">Qwen edit</button>
          <button type="button" data-mode="generate" class="seg-btn" title="FLUX.1 schnell — 4-step text-to-image, no input image needed">generate</button>
          <button type="button" data-mode="outpaint" class="seg-btn" title="Extend the canvas in any direction(s). Pad area is filled with black, then FLUX.1 Fill regenerates only the new pixels using your prompt. Reuses the Fill model — no extra VRAM.">outpaint</button>
          <button type="button" data-mode="control" class="seg-btn" title="FLUX ControlNet (Union-Pro) — generation conditioned on a structural map. Upload a canny / depth / pose image, the model follows that geometry while filling style + texture from the prompt. ~30 GB on disk (FLUX.1-dev + ControlNet), ~8 GB VRAM under NF4. First call downloads the weights.">control</button>
        </div>
      </div>

      <div class="row brush-row hidden" id="brushRow">
        <label>brush <input id="brushSize" type="range" min="4" max="120" value="40" /></label>
        <button type="button" id="clearMask">clear mask</button>
      </div>

      <div class="row control-row hidden" id="controlRow">
        <label title="Conditioning type. canny = follow edge contours. depth = follow 3D structure (depth map). pose = follow OpenPose skeleton.">control type
          <select id="controlType">
            <option value="canny" selected>canny (edges)</option>
            <option value="depth">depth (3D structure)</option>
            <option value="pose">pose (skeleton)</option>
          </select>
        </label>
        <label title="ControlNet conditioning strength. 0.4-0.6 = light suggestion; 0.7-0.9 = strong adherence (default 0.7); above 1.0 = over-conditioned, output flattens. Adjust if the result ignores or over-fits the control image.">scale
          <input id="controlScale" type="number" step="0.05" min="0" max="2" value="0.7" />
        </label>
        <span class="muted small">upload the pre-processed control image as input (canny edges, depth map, or pose skeleton). Use tools like controlnet_aux to generate these from a regular photo.</span>
      </div>

      <div class="row outpaint-row hidden" id="outpaintRow">
        <label title="Pixels to add above the image">top <input id="padTop" type="number" min="0" max="1024" step="32" value="256" /></label>
        <label title="Pixels to add to the right">right <input id="padRight" type="number" min="0" max="1024" step="32" value="256" /></label>
        <label title="Pixels to add below the image">bottom <input id="padBottom" type="number" min="0" max="1024" step="32" value="256" /></label>
        <label title="Pixels to add to the left">left <input id="padLeft" type="number" min="0" max="1024" step="32" value="256" /></label>
        <span class="muted small">prompt describes what fills the extended area</span>
      </div>

      <div class="row auto-mask-row hidden" id="autoMaskRow">
        <input id="autoMaskText" type="text" placeholder="describe what to mask · e.g. 'the sky', 'her coat', 'the dragon'" />
        <button type="button" id="autoMaskBtn" title="Florence-2 segments the described region — mask is painted onto the canvas, you can refine with brush before running inpaint">auto-mask</button>
        <span id="autoMaskStatus" class="muted small"></span>
      </div>

      <div class="row prompt-row">
        <textarea id="prompt" placeholder="e.g. 'replace the sky with a dramatic sunset' (Kontext) — or for inpaint: describe only what should appear inside the mask"></textarea>
        <div class="prompt-actions">
          <button type="button" id="expandPromptBtn" title="Qwen2.5-1.5B rewrites your short prompt into a FLUX-style description packed with lighting, composition, lens cues. ~3 GB VRAM, ~1 s on a warm model. Result replaces the textarea — undo (Ctrl+Z in the textarea) brings the original back.">✨ expand</button>
        </div>
        <span id="expandStatus" class="muted small"></span>
      </div>

      <div class="row pipeline-row">
        <label class="pipeline-toggle" title="When on, each non-empty line of the prompt is a separate step. Prefix a line with [mode] (e.g. [generate], [kontext], [auto_mask]) to force that model. Use [auto_mask] <phrase> followed by [inpaint] for 'segment X, then inpaint that region' without brushing. Steps run sequentially and feed each other.">
          <input type="checkbox" id="pipelineToggle" />
          <span>pipeline mode (each line = a step, optional [mode] prefix)</span>
        </label>
      </div>

      <div class="row params">
        <label title="20 for exploration / iteration · 28 for final render. Above 28 wastes compute — Flux is rectified flow, converges fast.">steps <input id="steps" type="number" min="1" max="60" value="28" /></label>
        <label title="2.5–4.0 sane range. Lower = creative, higher = literal. Above 5 burns detail.">guidance <input id="guidance" type="number" step="0.1" min="0" max="20" value="3.5" /></label>
        <label title="Clear to randomize. After each run, the actually-used seed lands here — keep it to A/B-test prompt tweaks at fixed seed.">seed <input id="seed" type="number" placeholder="random" /></label>
        <label title="Cap on the longest edge of the input image — server downscales to this, then LANCZOS-upscales the output back to the original size. Lower = faster, less detail. Empty = use server default (shown in the profile line above).">max edge <input id="maxEdge" type="number" min="64" max="2048" step="64" placeholder="server" /></label>
        <label title="PIL UnsharpMask after LANCZOS upscale. Counters softening from the round-trip. 'strong' can create halos on hard edges; 'light' is safe for portraits.">sharpen
          <select id="sharpen">
            <option value="off" selected>off</option>
            <option value="light">light</option>
            <option value="medium">medium</option>
            <option value="strong">strong</option>
          </select>
        </label>
        <label title="Upscaler used to restore the original input dimensions after diffusion. 'lanczos' = fast interpolation (legacy). 'real-esrgan 4x' = learned super-resolution that synthesizes texture detail (skin pores, fabric weave, distant foliage) instead of inventing edges from luminance gradients. Adds ~5-15s per image, ~600 MB VRAM.">upscale
          <select id="upscale">
            <option value="lanczos" selected>lanczos</option>
            <option value="real_esrgan_4x">real-esrgan 4x</option>
          </select>
        </label>
        <label title="Number of variants to generate (different seeds, same prompt + params). 1 = direct run; 2-8 = pick the best afterwards. Worker is single-GPU so variants run sequentially.">variants <input id="variants" type="number" min="1" max="8" value="1" /></label>
      </div>

      <div class="row ip-adapter-row" id="ipAdapterRow">
        <label class="ip-dropzone" id="ipDropzone" title="Optional reference image. FLUX inherits its visual style and composition from this image alongside the prompt — useful when an aesthetic is hard to describe in words. Pairs with style LoRAs; scale 0.5-0.8 is the typical range. Applies to Kontext + generate modes.">
          <input type="file" id="ipFile" accept="image/*" hidden />
          <span id="ipDropHint">ref image (optional)</span>
        </label>
        <label title="IP-Adapter conditioning strength. 0 disables. 0.5-0.8 is typical; above 1.0 the reference dominates the prompt.">weight
          <input id="ipScale" type="number" step="0.05" min="0" max="2" value="0.7" />
        </label>
        <button type="button" id="ipClear" class="secondary tiny" title="Remove the reference image (skip IP-Adapter conditioning for the next run)">clear</button>
      </div>

      <div class="row lora-row" id="loraRow">
        <label class="lora-select" title="Style LoRA — biases FLUX toward a specific aesthetic (fantasy, anime, retro sci-fi…). Loaded once on first use; applies to Kontext + generate only. Inpaint + Qwen ignore it.">style LoRA
          <select id="styleLora">
            <option value="">(none)</option>
          </select>
        </label>
        <label title="Adapter weight. 1.0 = trained default; lower for subtle hint, higher for stronger style. Above ~1.3 starts breaking anatomy.">weight
          <input id="styleLoraScale" type="number" step="0.05" min="0" max="2" value="1.0" />
        </label>
        <span id="loraTrigger" class="muted small"></span>
      </div>

      <div class="row accel-row hidden" id="accelRow">
        <label class="accel-toggle" title="Hyper-SD / Flux-Turbo LoRA on the transformer. When on: 8 steps gives near-28-step quality at ~3× speed. Toggle off for final renders.">
          <input type="checkbox" id="accelToggle" checked />
          <span>acceleration LoRA · 8 steps</span>
          <span id="accelInfo" class="muted small"></span>
        </label>
      </div>

      <div class="row run-row">
        <button id="run" class="run">edit image</button>
        <button id="abort" class="abort hidden" type="button">abort</button>
        <button id="refresh" class="secondary" type="button" title="clear image, mask, prompt and result">reset</button>
      </div>
      <div class="row">
        <span id="status" class="muted"></span>
      </div>

      <div class="row progress-row" id="progressRow">
        <div class="prog">
          <div class="prog-head">
            <span id="progLabel">idle</span>
            <span id="progEta" class="muted"></span>
          </div>
          <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
        </div>
        <div class="gpu">
          <div class="gpu-head"><span id="gpuName">GPU</span></div>
          <div class="gpu-row">
            <span>util</span>
            <div class="gpu-bar"><div class="gpu-fill" id="gpuUtilFill"></div></div>
            <span id="gpuUtilLabel">—</span>
          </div>
          <div class="gpu-row">
            <span>vram</span>
            <div class="gpu-bar"><div class="gpu-fill" id="gpuVramFill"></div></div>
            <span id="gpuVramLabel">—</span>
          </div>
          <div class="gpu-row muted small">
            <span id="gpuTemp">— °C</span>
            <span id="gpuPower">— W</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel right">
      <div class="canvas-row">
        <div class="canvas-wrap" id="inputWrap">
          <canvas id="imgCanvas"></canvas>
          <canvas id="maskCanvas"></canvas>
        </div>
        <div class="result-wrap hidden" id="resultWrap">
          <img id="result" alt="" />
        </div>
      </div>
      <div class="row result-row">
        <div class="result-actions hidden" id="resultActions">
          <a id="download" download="edit.png">download</a>
          <button id="useAsInput" class="secondary chain" type="button" title="make this result the new input for chained edits">use as input →</button>
        </div>
      </div>

      <div class="row history-row hidden" id="historyRow">
        <div class="history-head">
          <span>history</span>
          <button id="historyClear" class="secondary tiny" type="button">clear</button>
        </div>
        <div class="history-strip" id="historyStrip"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
