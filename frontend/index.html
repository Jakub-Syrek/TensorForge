<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiPictureModifier · FLUX edit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>AiPictureModifier</h1>
    <div id="health" class="muted">checking GPU…</div>
  </header>

  <main>
    <section class="panel left">
      <div class="row">
        <label class="dropzone" id="dropzone">
          <input type="file" id="file" accept="image/*" hidden />
          <span id="dropHint">drop image · or click to choose</span>
        </label>
      </div>

      <div class="row mode-row">
        <div class="seg">
          <button type="button" data-mode="kontext" class="seg-btn active" title="FLUX.1 Kontext-dev — instruction edit, preserves composition">Kontext</button>
          <button type="button" data-mode="inpaint" class="seg-btn" title="FLUX.1 Fill-dev — regenerates the masked region only">inpaint</button>
          <button type="button" data-mode="qwen" class="seg-btn" title="Qwen-Image-Edit — alternative instruction edit (Qwen2-VL text encoder, ~50 steps default)">Qwen edit</button>
        </div>
      </div>

      <div class="row brush-row hidden" id="brushRow">
        <label>brush <input id="brushSize" type="range" min="4" max="120" value="40" /></label>
        <button type="button" id="clearMask">clear mask</button>
      </div>

      <div class="row">
        <textarea id="prompt" placeholder="e.g. 'replace the sky with a dramatic sunset' (Kontext) — or for inpaint: describe only what should appear inside the mask"></textarea>
      </div>

      <div class="row params">
        <label title="20 for exploration / iteration · 28 for final render. Above 28 wastes compute — Flux is rectified flow, converges fast.">steps <input id="steps" type="number" min="1" max="60" value="28" /></label>
        <label title="2.5–4.0 sane range. Lower = creative, higher = literal. Above 5 burns detail.">guidance <input id="guidance" type="number" step="0.1" min="0" max="20" value="3.5" /></label>
        <label title="Clear to randomize. After each run, the actually-used seed lands here — keep it to A/B-test prompt tweaks at fixed seed.">seed <input id="seed" type="number" placeholder="random" /></label>
      </div>

      <div class="row accel-row hidden" id="accelRow">
        <label class="accel-toggle" title="Hyper-SD / Flux-Turbo LoRA on the transformer. When on: 8 steps gives near-28-step quality at ~3× speed. Toggle off for final renders.">
          <input type="checkbox" id="accelToggle" checked />
          <span>acceleration LoRA · 8 steps</span>
          <span id="accelInfo" class="muted small"></span>
        </label>
      </div>

      <div class="row run-row">
        <button id="run" class="run">edit image</button>
        <button id="abort" class="abort hidden" type="button">abort</button>
        <button id="refresh" class="secondary" type="button" title="clear image, mask, prompt and result">reset</button>
      </div>
      <div class="row">
        <span id="status" class="muted"></span>
      </div>

      <div class="row progress-row" id="progressRow">
        <div class="prog">
          <div class="prog-head">
            <span id="progLabel">idle</span>
            <span id="progEta" class="muted"></span>
          </div>
          <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
        </div>
        <div class="gpu">
          <div class="gpu-head"><span id="gpuName">GPU</span></div>
          <div class="gpu-row">
            <span>util</span>
            <div class="gpu-bar"><div class="gpu-fill" id="gpuUtilFill"></div></div>
            <span id="gpuUtilLabel">—</span>
          </div>
          <div class="gpu-row">
            <span>vram</span>
            <div class="gpu-bar"><div class="gpu-fill" id="gpuVramFill"></div></div>
            <span id="gpuVramLabel">—</span>
          </div>
          <div class="gpu-row muted small">
            <span id="gpuTemp">— °C</span>
            <span id="gpuPower">— W</span>
          </div>
        </div>
      </div>
    </section>

    <section class="panel right">
      <div class="canvas-wrap">
        <canvas id="imgCanvas"></canvas>
        <canvas id="maskCanvas"></canvas>
      </div>
      <div class="row result-row">
        <img id="result" alt="" />
        <div class="result-actions hidden" id="resultActions">
          <a id="download" download="edit.png">download</a>
          <button id="useAsInput" class="secondary chain" type="button" title="make this result the new input for chained edits">use as input →</button>
        </div>
      </div>

      <div class="row history-row hidden" id="historyRow">
        <div class="history-head">
          <span>history</span>
          <button id="historyClear" class="secondary tiny" type="button">clear</button>
        </div>
        <div class="history-strip" id="historyStrip"></div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
